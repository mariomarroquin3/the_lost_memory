<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Rescate del Contexto</title>
  </head>
  <body>
    <main class="game-shell">
      <!-- TOPBAR ESTILO PROYECTO 21 (IMAGEN 1) -->
      <header class="topbar">
        <div class="brand">RESCATE<span class="brand-colon">:</span>CONTEXTO</div>
        <p class="topbar-controls">Flechas o WASD: mover · E: usar · Esc: cerrar · M: música · F: pantalla completa</p>
        <div class="topbar__actions">
          <button type="button" id="lobby-button" class="btn-topbar">Menú<br>partida</button>
          <button type="button" id="guide-button" class="btn-topbar">Guía<br>(G)</button>
          <button type="button" id="music-button" class="btn-topbar">Música: no<br>(M)</button>
          <button type="button" id="fullscreen-button" class="btn-topbar">Pantalla<br>completa (F)</button>
        </div>
      </header>

      <!-- PANTALLA PRINCIPAL CON ASPECT-RATIO 5:3 -->
      <div class="screen-frame">
        <canvas id="game" width="640" height="384" aria-label="El Rescate del Contexto"></canvas>
        <div id="room-banner" class="room-banner" aria-live="polite"></div>
        <aside id="hud" class="hud" aria-live="polite"></aside>
        </div>
      <div id="overlay" class="overlay" hidden></div>
      <div id="lobby" class="lobby" hidden></div>

      <!-- PANEL INFERIOR DE PROGRESO (IMAGEN 1) -->
      <section class="progress-panel">
        <!-- MINIMAPA DE SALAS (LADO IZQUIERDO) -->
        <div class="minimap-container">
          <div class="minimap-grid" id="minimap-grid"></div>
        </div>

        <!-- CASILLAS DE FRAGMENTOS / PALABRAS (CENTRO Y DERECHA) -->
        <div class="fragments-container">
          <div class="fragments-header">
            <span id="fragment-count">Fragmentos de contexto · 0 de 10 recuperados</span>
          </div>
          <div class="fragment-slots" id="fragment-slots"></div>
          <div class="fragments-footer">
            <span class="collectibles-label" id="collectibles-label">Sin señales recibidas</span>
          </div>
        </div>
      </section>

      <!-- CONTROLES TÁCTILES OPCIONALES PARA MÓVIL -->
      <div class="touch-controls" aria-label="Controles táctiles">
        <button type="button" data-key="arrowup">▲</button>
        <div>
          <button type="button" data-key="arrowleft">◀</button>
          <button type="button" data-action="interact">E</button>
          <button type="button" data-key="arrowright">▶</button>
        </div>
        <button type="button" data-key="arrowdown">▼</button>
      </div>
    </main>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
