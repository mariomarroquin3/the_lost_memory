<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Lost Memory</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand">THE LOST MEMORY</div>
        <p>Flechas o WASD: mover · E: mirar o usar · M: música · F: pantalla completa</p>
        <div class="topbar__actions"><button type="button" id="map-button">Mapa (Tab)</button><button type="button" id="control-button">PC de control</button><button type="button">Pantalla completa (F)</button></div>
      </header>
      <canvas id="game" width="640" height="360" aria-label="The Lost Memory"></canvas>
      <div id="room-banner" class="room-banner" aria-live="polite"></div>
      <aside id="hud" class="hud" aria-live="polite"></aside>
      <div id="overlay" class="overlay" hidden></div>
      <section class="progress-panel">
        <div class="phrase-map">
          <span class="phrase-map__title">MEMORIA RECUPERADA</span>
          <div class="fragment-grid" id="fragment-grid"></div>
        </div>
        <div class="progress-copy">
          <p id="fragment-count">Fragmentos · 0 de 10</p>
          <div class="fragment-words" id="fragment-words"><span>IDENTIDAD</span><span>VERDAD</span><span>APRENDIZAJE</span><span>PERCEPCIÓN</span><span>MEMORIA</span></div>
          <p class="collectibles">Coleccionables · 0 de 10</p>
        </div>
      </section>
      <div class="touch-controls" aria-label="Controles táctiles"><button type="button" data-key="arrowup">▲</button><div><button type="button" data-key="arrowleft">◀</button><button type="button" data-action="interact">E</button><button type="button" data-key="arrowright">▶</button></div><button type="button" data-key="arrowdown">▼</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
